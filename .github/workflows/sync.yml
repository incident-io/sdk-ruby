name: sync

# Runs hourly once enabled. When the schema hasn't changed the job exits in
# seconds, which is what makes that affordable.
#
# Do not rename this file. RubyGems' trusted-publishing binding is registered
# against the repo and this filename, so a rename breaks publishing silently.
on:
  # Disabled until trusted publishing is set up on RubyGems.org: without it the
  # first schema change would tag and release, then fail at the publish step.
  # See CONTRIBUTING.md, "First release checklist". Uncomment to start the
  # hourly loop. Avoid minute 0, which is GitHub's most contended slot.
  # schedule:
  #   - cron: "29 * * * *" # hourly
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [minor, major]
        default: minor
      acknowledge_breaking:
        description: "Publish even though a gate reports a breaking change"
        type: boolean
        default: false
      dry_run:
        description: "Regenerate and verify, but don't tag, release or publish"
        type: boolean
        default: false

permissions:
  contents: write # commit + tag + create release
  issues: write # open an issue when something needs a human
  id-token: write # RubyGems trusted publishing (job-scoped, hence one job)

concurrency:
  group: sync
  cancel-in-progress: false

env:
  # The Ruby the release builds and publishes with. The floor is checked
  # separately below.
  RELEASE_RUBY: "3.4"

jobs:
  sync:
    runs-on: ubuntu-latest
    # cancel-in-progress is false, so a hung run holds the group until it dies.
    # The default is six hours. A timeout is a *cancellation*, and `if:
    # failure()` steps do not run on a cancelled job, so a timeout between the
    # tag push and `gem push` would strand the tag with no issue filed. Leave
    # room.
    timeout-minutes: 45
    steps:
      # First, so a dispatch typo fails before anything else runs.
      # acknowledge_breaking only makes sense alongside a major: shipping an
      # acknowledged break as a minor is what every gate here exists to prevent.
      - name: Reject acknowledging a break without a major bump
        if: inputs.acknowledge_breaking && inputs.bump != 'major'
        run: |
          echo "::error::acknowledge_breaking requires bump: major."
          exit 1

      # Shallow: the no-change path only needs openapi.json. Tags are fetched
      # once the schema has changed, in "Decide next version".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Goes to a scratch path because oasdiff needs both versions to compare;
      # writing straight over openapi.json would lose the old one.
      - name: Fetch latest public schema
        run: make fetch OUT=openapi.json.new

      - name: Exit early if schema unchanged
        id: changed
        run: |
          if diff -q openapi.json openapi.json.new >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the fetched schema is a schema
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 scripts/check_schema.py openapi.json.new \
            || (echo "::error::The fetched schema is not usable; leaving the committed one alone." && exit 1)

      # Nothing below needs Ruby until the schema has actually changed, and
      # most runs stop above.
      - if: steps.changed.outputs.changed == 'true'
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ${{ env.RELEASE_RUBY }}
          bundler-cache: true
      - if: steps.changed.outputs.changed == 'true'
        # ~30MB from Maven Central, fetched by the Makefile into /tmp. Keyed on
        # the Makefile because that is where OPENAPI_GENERATOR_VERSION lives.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/openapi-generator-cli-*.jar
          key: openapi-generator-${{ hashFiles('Makefile') }}

      - name: Check for breaking changes
        if: steps.changed.outputs.changed == 'true'
        id: breaking
        run: |
          set -euo pipefail
          # The Makefile's pinned binary, so this and `make oasdiff` agree.
          oasdiff="$(make -s oasdiff-bin | tail -1)"

          # oasdiff-severity.txt adjusts rules in both directions; it takes no
          # comments of its own.
          #
          # Down to WARN: an added response enum value, because
          # scripts/prepare_spec.py turns every enum into a plain string, and a
          # tightened request minimum, because the generator's range checks
          # only run client-side against values the caller chose. Left at ERR
          # these halt about a quarter of real schema changes.
          #
          # Up to ERR: a removed operationId or component schema. Neither
          # changes the wire contract, so oasdiff rates them info, but both
          # rename something callers reference.
          report="$("$oasdiff" breaking openapi.json openapi.json.new \
            --severity-levels oasdiff-severity.txt --fail-on ERR 2>&1)" && rc=0 || rc=$?
          echo "$report"

          # 1 means it found breaking changes. Anything else means it couldn't
          # do the comparison at all, which is not a breaking change and
          # mustn't be filed as one.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::oasdiff exited $rc without comparing the schemas."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            { echo "report<<OASDIFF_EOF"; echo "$report"; echo "OASDIFF_EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      # A human dispatch with acknowledge_breaking skips this. The first step
      # requires bump: major alongside it, so an acknowledged break cannot ship
      # as a minor.
      - name: Halt on breaking change
        if: steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking == 'true' && !inputs.acknowledge_breaking
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.breaking.outputs.report }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          The upstream OpenAPI schema changed in a way that is **not backwards-compatible**, so the automated release was halted rather than publishing a breaking change as a minor bump.

          A human needs to decide how to proceed, most likely a new major version.

          To release it once you have decided: run \`make surface\` if the Ruby API lost names, commit \`api-surface.txt\`, then run this workflow from the Actions tab
          (**Run workflow**) with **bump: major** and **acknowledge_breaking: true**. Both
          are required together. Close this issue afterwards, or the next genuine
          breaking change will be deduped against it and file nothing.

          <details><summary>oasdiff report</summary>

          \`\`\`
          $REPORT
          \`\`\`

          </details>

          Triggered by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )"
          # Created here rather than assumed: gh issue create fails outright on
          # a label that doesn't exist, and an unlabelled fallback would be
          # invisible to the dedup below, filing one issue an hour forever.
          gh label create breaking-change \
            --description "Schema changed incompatibly; release halted" \
            --color B60205 2>/dev/null || true

          # We stop without committing the new schema, so every later run sees
          # the same diff and lands here again. Only file one issue. `|| true`
          # and then test the text: under pipefail a gh outage would otherwise
          # read as "none open" and file one issue an hour.
          open_issue="$(gh issue list --label breaking-change --state open --limit 1 \
            --json number --jq '.[0].number // empty' || true)"
          if [ -n "$open_issue" ]; then
            echo "::error::Breaking change detected; an issue is already open."
            exit 1
          fi

          gh issue create \
            --title "Breaking API change detected — manual release required" \
            --body "$body" \
            --label breaking-change
          echo "::error::Breaking change detected; opened an issue and stopped."
          exit 1

      # Scheduled runs only ever bump minor, since anything breaking has
      # already stopped the run. Patch is for hand-fixes; major needs a human
      # dispatch with both bump: major and acknowledge_breaking.
      - name: Decide next version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail
          # The checkout is shallow and has no tags.
          git fetch --quiet --tags --depth=1 origin
          BUMP="${{ inputs.bump || 'minor' }}"
          # Highest version, not `git describe`'s nearest-by-commit-distance: a
          # hand-cut patch tag would otherwise make us recompute a version that
          # already exists. The pattern also skips any non-semver tag.
          BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"

          if [ -z "$BASE" ]; then
            NEXT="v1.0.0"
          elif [ "$BUMP" = "major" ]; then
            NEXT="$(echo "${BASE#v}" | awk -F. '{printf "v%d.0.0", $1+1}')"
          else
            NEXT="$(echo "${BASE#v}" | awk -F. '{printf "v%d.%d.0", $1, $2+1}')"
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::$NEXT already exists. A previous run tagged without"
            echo "::error::publishing, or a tag was cut by hand. Resolve before releasing."
            exit 1
          fi

          # A version already on RubyGems would fail at `gem push`, after the
          # tag is pushed. Ask now, while nothing has happened.
          GEM="$(ruby -e 'print Gem::Specification.load("incident_io.gemspec").name')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/${GEM}/versions/${NEXT#v}.json")"
          if [ "$status" = "200" ]; then
            echo "::error::${GEM} ${NEXT#v} is already on RubyGems."
            exit 1
          elif [ "$status" != "404" ]; then
            echo "::error::RubyGems returned $status; cannot tell whether ${NEXT#v} exists."
            exit 1
          fi

          echo "Next version: $NEXT (base: ${BASE:-none}, bump: $BUMP)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # Before verification, so what we check is what we publish.
      - name: Set the release version
        if: steps.changed.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i -E "s/^  VERSION = \".*\"$/  VERSION = \"${NEXT#v}\"/" lib/incident_io/version.rb
          # Assert, don't just echo: a sed that matched nothing exits 0, and
          # the release would rebuild the old version.
          grep -q "^  VERSION = \"${NEXT#v}\"$" lib/incident_io/version.rb \
            || (echo "::error::version.rb still does not hold ${NEXT#v}" && exit 1)

      - name: Regenerate and check
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mv openapi.json.new openapi.json
          make generate
          # make test depends on make verify: syntax check, build and install
          # the gem, load every constant, check the API surface (and record
          # additions to it), then the specs.
          make test

      # The declared floor is a promise nothing else here checks, since the
      # release builds on RELEASE_RUBY, and it has to fail before publishing.
      - if: steps.changed.outputs.changed == 'true'
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: "3.0"
      - name: Check the minimum Ruby
        if: steps.changed.outputs.changed == 'true'
        run: make package

      - name: Commit, tag and push
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        id: push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "incident-io-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json lib .openapi-generator api-surface.txt
          # Anything this allowlist misses would be left out of the release
          # commit, and the gem pushed below is built from the working tree, so
          # it would ship code the tag does not contain. Catch it here, while
          # the tag is still local and the next run can retry.
          #
          # Only the residue: --porcelain lists staged entries too, with the
          # status in column 1.
          residue="$(git status --porcelain | grep -v '^[MADRC] ' || true)"
          if [ -n "$residue" ]; then
            echo "::error::Files changed that the commit does not stage. Add them"
            echo "::error::to the git add above, or gitignore them."
            echo "$residue"
            exit 1
          fi
          git commit -m "Update to schema as of $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Regenerated from https://api.incident.io/v1/openapiV3.json"
          git tag "$NEXT"
          # --atomic: otherwise the tag can land while the branch push is
          # refused, and every later run recomputes this version and dies on
          # "tag already exists".
          git push --atomic origin HEAD "refs/tags/$NEXT"

      # After the push, never before: RubyGems versions cannot be reused, even
      # after a yank, so publishing first and failing to push would burn the
      # number and leave the repo unable to recompute it.
      #
      # Has to live in this job: id-token is job-scoped, and a tag pushed with
      # GITHUB_TOKEN won't trigger a separate workflow.
      - name: Authenticate to RubyGems
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # pkg/incident_io.gem is the gem `make package` built on the floor Ruby
      # a step ago, from this commit, with the release version set.
      - name: Publish to RubyGems
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        id: publish
        run: gem push pkg/incident_io.gem

      - name: Create the GitHub release
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --generate-notes --title "$NEXT"

      # Every other signal in this workflow is a failure() hook, and a loop
      # that never runs never fails: a disabled cron and a quiet API look
      # identical in the Actions tab. This line says the loop ran and what it
      # decided.
      #
      # GitHub disables a scheduled workflow after 60 days without repository
      # activity. This repo's activity is its own release commits, which stop
      # exactly when the schema stops changing.
      - name: Record what this run did
        if: always() && steps.changed.outputs.changed != ''
        env:
          CHANGED: ${{ steps.changed.outputs.changed }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            line="Schema unchanged; nothing to release."
          elif [ "$DRY_RUN" = "true" ]; then
            line="Dry run: would have released ${NEXT:-nothing (halted before a version was chosen)}. Nothing was tagged or published."
          elif [ "$PUBLISHED" = "true" ]; then
            line="Schema changed; released $NEXT."
          else
            line="Schema changed; nothing released (halted or failed)."
          fi
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # Last in the job so it can observe every step, including the commit,
      # push and publish above. Without this a failed run is a red cron every
      # hour and no other signal.
      #
      # Narrowed to a release that got going and wedged: not a failed fetch,
      # which the next run fixes by itself; not a dry run, which changed
      # nothing. A dispatch typo fails at the first step, before `changed` is
      # set, so it never gets here. Each of those would otherwise take the dedup
      # lock below and hide a real stuck release.
      - name: Report a stuck release
        # `breaking != true` leaves the Halt step's own issue alone. On an
        # acknowledged break the run continues, so the acknowledge_breaking arm
        # keeps a failure after the push from being silenced.
        if: >-
          failure()
          && steps.changed.outputs.changed == 'true'
          && !inputs.dry_run
          && (steps.breaking.outputs.breaking != 'true' || inputs.acknowledge_breaking)
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.push.outcome == 'success' }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail

          if [ "$PUBLISHED" = "true" ]; then
            title="Release $NEXT is published but has no GitHub release"
            body="**$NEXT** is tagged and is on RubyGems. The run then failed before creating the GitHub release, so only that is missing. Nothing is broken for consumers, and the next run proceeds normally.

          To finish it:

          \`\`\`
          gh release create $NEXT --generate-notes --title $NEXT
          \`\`\`

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          elif [ "$PUSHED" = "true" ]; then
            # The schema is committed and the tag is pushed, so the next run
            # sees no diff and exits in seconds. Nothing retries.
            title="Release $NEXT is tagged but not published"
            body="The sync pushed the commit and the tag for **$NEXT**, then failed before finishing. The gem is **not on RubyGems**.

          This will not fix itself. The next run finds the schema unchanged and exits in seconds, so the cron goes green and nothing retries.

          To finish it by hand, from the tag:

          \`\`\`
          git fetch --tags && git switch --detach $NEXT
          gem build incident_io.gemspec --output pkg/incident_io.gem
          gem push pkg/incident_io.gem
          gh release create $NEXT --generate-notes --title $NEXT
          \`\`\`

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely causes: RubyGems trusted publishing is not configured for this repo and this workflow filename, the token exchange failed, or RubyGems was down."
          else
            title="Release is stuck — regeneration or verification is failing"
            body="The hourly sync failed after detecting a schema change, before committing anything. The next run will see the same diff and fail the same way, so this repeats hourly until someone looks.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely causes: the generator rejected the new schema, a fix in \`scripts/\` stopped matching, the API surface lost a name (\`make verify\` lists them), a spec failed, or the gem no longer builds on the minimum Ruby."
          fi

          gh label create release-stuck \
            --description "The hourly sync could not complete a release" \
            --color B60205 2>/dev/null || true

          # Dedup only the pre-commit case, which repeats hourly. The post-push
          # cases cannot repeat and are the ones with side effects that do not
          # undo themselves, so never swallow them.
          open_issue="$(gh issue list --label release-stuck --state open --limit 1 \
            --json number --jq '.[0].number // empty' || true)"
          if [ "$PUSHED" != "true" ] && [ -n "$open_issue" ]; then
            echo "Already reported."
            exit 0
          fi

          gh issue create --title "$title" --label release-stuck --body "$body"
